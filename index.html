<!DOCTYPE html>
  <html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
      <title>To-do List</title>


      <style>
          * { box-sizing: border-box; margin: 0; padding: 0; }

          :root {
              --bg-page:      #f5f0e8;
              --bg-card:      #fffdf7;
              --bg-item:      #faf7f0;
              --border:       #e8e0d0;
              --border-input: #d4c9b5;
              --text-main:    #3d2b1f;
              --text-sub:     #8b7355;
              --text-muted:   #b8a898;
              --btn-primary:  #8b6f47;
              --btn-hover:    #6b5237;
              --shadow:       0 4px 16px rgba(139,111,71,0.12);
          }

          body.dark {
              --bg-page:      #1c1814;
              --bg-card:      #252018;
              --bg-item:      #2e2820;
              --border:       #3d3428;
              --border-input: #4a3f30;
              --text-main:    #f0e6d3;
              --text-sub:     #a89070;
              --text-muted:   #6b5a48;
              --btn-primary:  #c4956a;
              --btn-hover:    #d4a87a;
              --shadow:       0 4px 16px rgba(0,0,0,0.4);
          }

          body {
              font-family: 'Lora', Georgia, serif;
              background-color: var(--bg-page);
              display: flex;
              justify-content: center;
              padding: 40px 20px;
              min-height: 100vh;
              transition: background-color 0.3s;
          }

          .container {
              background-color: var(--bg-card);
              padding: 30px;
              border-radius: 12px;
              width: 100%;
              max-width: 700px;
              box-shadow: var(--shadow);
              transition: background-color 0.3s;
          }

          .header {
              display: flex;
              align-items: center;
              justify-content: center;
              position: relative;
              margin-bottom: 20px;
          }

          h1 {
              color: var(--text-main);
              font-size: 22px;
              letter-spacing: 1px;
          }

          .btn-dark-mode {
              position: absolute;
              right: 0;
              background: none;
              border: 1px solid var(--border-input);
              border-radius: 8px;
              padding: 4px 10px;
              cursor: pointer;
              font-size: 18px;
              color: var(--text-main);
              transition: all 0.2s;
          }

          .btn-dark-mode:hover {
              background-color: var(--btn-primary);
              color: var(--bg-card);
          }

          /* Tabs */
          .tabs {
              display: flex;
              margin-bottom: 20px;
              border-bottom: 2px solid var(--border);
          }

          .tab {
              padding: 8px 20px;
              cursor: pointer;
              font-size: 15px;
              color: var(--text-sub);
              border-bottom: 2px solid transparent;
              margin-bottom: -2px;
              transition: all 0.15s;
              font-family: 'Lora', Georgia, serif;
          }

          .tab:hover { color: var(--text-main); }

          .tab.active {
              color: var(--text-main);
              border-bottom: 2px solid var(--btn-primary);
              font-weight: 600;
          }

          .man-hinh { display: none; }
          .man-hinh.active { display: block; }

          /* Form */
          .input-block {
              display: flex;
              flex-direction: column;
              gap: 8px;
              margin-bottom: 8px;
          }

          .input-row {
              display: flex;
              gap: 8px;
          }

          input[type="text"],
          input[type="date"],
          select {
              padding: 10px 12px;
              border: 2px solid var(--border-input);
              border-radius: 8px;
              font-size: 16px;
              color: var(--text-main);
              background-color: var(--bg-card);
              transition: border-color 0.2s, background-color 0.3s, color 0.3s;
              width: 100%;
              color-scheme: light;
              font-family: 'Lora', Georgia, serif;
              -webkit-appearance: auto;
              appearance: auto;
          }

          body.dark input[type="date"] { color-scheme: dark; }

          input[type="text"] { flex: 1; }

          input[type="text"]:focus,
          input[type="date"]:focus,
          select:focus {
              outline: none;
              border-color: var(--btn-primary);
          }

          select { cursor: pointer; padding-right: 28px; }

          .thoi-gian-row {
              display: flex;
              gap: 6px;
              width: 100%;
          }

          .thoi-gian-row input[type="date"] { flex: 1; min-width: 0; }
          .thoi-gian-row select { flex: 0 0 auto; width: auto; min-width: 68px; }
          .thoi-gian-row select.sel-ampm { min-width: 58px; }

          button.btn-them {
              padding: 10px 16px;
              background-color: var(--btn-primary);
              color: var(--bg-card);
              border: none;
              border-radius: 8px;
              font-size: 15px;
              cursor: pointer;
              white-space: nowrap;
              transition: background-color 0.2s;
              font-family: 'Lora', Georgia, serif;
          }

          button.btn-them:hover { background-color: var(--btn-hover); }

          /* Tìm kiếm */
          .o-tim-kiem {
              position: relative;
              margin-bottom: 8px;
          }

          .o-tim-kiem input {
              width: 100%;
              padding: 9px 12px 9px 34px;
              border: 2px solid var(--border-input);
              border-radius: 8px;
              font-size: 15px;
              color: var(--text-main);
              background-color: var(--bg-card);
              font-family: 'Lora', Georgia, serif;
          }

          .o-tim-kiem input:focus {
              outline: none;
              border-color: var(--btn-primary);
          }

          .icon-tim-kiem {
              position: absolute;
              left: 10px;
              top: 50%;
              transform: translateY(-50%);
              color: var(--text-sub);
              font-size: 16px;
              pointer-events: none;
          }

          mark.highlight {
              background-color: #f0d080;
              border-radius: 3px;
              color: #3d2b1f;
          }

          body.dark mark.highlight {
              background-color: #b8860b;
              color: #fff;
          }

          /* Thanh lọc */
          .bo-loc {
              display: flex;
              gap: 6px;
              flex-wrap: nowrap;
              overflow-x: auto;
              margin: 6px 0 4px;
              padding-bottom: 2px;
              -webkit-overflow-scrolling: touch;
              scrollbar-width: none;
          }

          .bo-loc::-webkit-scrollbar { display: none; }

          .btn-loc {
              padding: 4px 12px;
              border: 1px solid var(--border-input);
              border-radius: 20px;
              background: transparent;
              font-size: 13px;
              cursor: pointer;
              color: var(--text-sub);
              transition: all 0.15s;
              font-family: 'Lora', Georgia, serif;
          }

          .btn-loc:hover {
              border-color: var(--btn-primary);
              color: var(--btn-primary);
          }

          .btn-loc.active {
              background-color: var(--btn-primary);
              color: var(--bg-card);
              border-color: var(--btn-primary);
          }

          /* Toolbar */
          .toolbar {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin: 8px 0 4px;
              gap: 8px;
          }

          .btn-toolbar {
              padding: 4px 12px;
              border: 1px solid var(--border-input);
              border-radius: 8px;
              background: transparent;
              font-size: 13px;
              cursor: pointer;
              color: var(--text-sub);
              transition: all 0.15s;
              white-space: nowrap;
              font-family: 'Lora', Georgia, serif;
          }

          .btn-toolbar:hover {
              border-color: var(--text-main);
              color: var(--text-main);
          }

          .btn-toolbar.nguy-hiem:hover {
              background-color: #e74c3c;
              border-color: #e74c3c;
              color: white;
          }

          select.chon-sap-xep {
              padding: 4px 10px;
              border: 1px solid var(--border-input);
              border-radius: 8px;
              background: transparent;
              font-size: 13px;
              cursor: pointer;
              color: var(--text-sub);
              width: auto;
              font-family: 'Lora', Georgia, serif;
          }

          select.chon-sap-xep:focus { outline: none; }

          /* Progress bar */
          .progress-wrap { margin: 10px 0 4px; }

          .progress-top {
              display: flex;
              justify-content: space-between;
              font-size: 12px;
              color: var(--text-sub);
              margin-bottom: 5px;
          }

          .progress-bar-bg {
              width: 100%;
              height: 6px;
              background-color: var(--border);
              border-radius: 10px;
              overflow: hidden;
          }

          .progress-bar-fill {
              height: 100%;
              background-color: var(--btn-primary);
              border-radius: 10px;
              transition: width 0.4s ease;
          }

          .progress-bar-fill.full { background-color: #7ba05b; }

          /* Nhóm ngày */
          .nhom-ngay { margin-top: 20px; }

          .tieu-de-ngay {
              font-size: 12px;
              font-weight: 600;
              color: var(--text-sub);
              text-transform: uppercase;
              letter-spacing: 1px;
              border-bottom: 1px solid var(--border);
              padding-bottom: 4px;
              margin-bottom: 8px;
              flex: 1;
          }

          .tieu-de-ngay.hom-nay { color: var(--btn-primary); }
          .tieu-de-ngay.qua-han { color: #c0392b; }

          .tieu-de-ngay-container {
              display: flex;
              justify-content: space-between;
              align-items: center;
              gap: 8px;
          }

          .btn-luu-tru-ngay {
              background: transparent;
              border: 1px solid var(--border);
              border-radius: 6px;
              padding: 4px 10px;
              font-size: 12px;
              color: var(--text-sub);
              cursor: pointer;
              font-family: 'Lora', Georgia, serif;
              transition: all 0.2s;
              white-space: nowrap;
          }

          .btn-luu-tru-ngay:hover {
              border-color: var(--btn-primary);
              color: var(--btn-primary);
              background: rgba(139, 111, 71, 0.08);
          }

          .btn-luu-tru-ngay:active {
              background: rgba(139, 111, 71, 0.15);
          }

          ul { list-style: none; }

          /* Animation */
          @keyframes slideIn {
              from { opacity: 0; transform: translateY(-8px); }
              to   { opacity: 1; transform: translateY(0); }
          }

          @keyframes slideOut {
              from { opacity: 1; transform: translateY(0); }
              to   { opacity: 0; transform: translateX(40px); }
          }

          li.them-moi { animation: slideIn 0.25s ease; }
          li.dang-xoa { animation: slideOut 0.2s ease forwards; }

          li {
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              padding: 10px 12px;
              background-color: var(--bg-item);
              border: 1px solid var(--border);
              border-radius: 8px;
              margin-top: 6px;
              font-size: 15px;
              gap: 8px;
              transition: background-color 0.3s;
              cursor: grab;
          }

          li:active { cursor: grabbing; }

          li.qua-han {
              border-left: 3px solid #e74c3c;
              background-color: rgba(231,76,60,0.06);
          }

          li.dang-keo {
              opacity: 0.4;
              border: 2px dashed var(--border-input);
          }

          li.vi-tri-tha { border-top: 3px solid var(--btn-primary); }

          .noi-dung-task {
              flex: 1;
              display: flex;
              flex-direction: column;
              gap: 3px;
              cursor: pointer;
          }

          .ten-cong-viec {
              font-size: 15px;
              color: var(--text-main);
          }

          .ten-cong-viec:hover { opacity: 0.7; }

          .gio-deadline {
              font-size: 12px;
              color: var(--text-sub);
          }

          .gio-deadline.qua-han {
              color: #e74c3c;
              font-weight: bold;
          }

          /* Đếm ngược */
          .dem-nguoc {
              font-size: 11px;
              padding: 1px 7px;
              border-radius: 20px;
              font-style: italic;
              display: inline-block;
              margin-top: 1px;
          }

          .dem-nguoc.gap {
              background-color: rgba(231,76,60,0.12);
              color: #e74c3c;
              font-weight: bold;
          }

          .dem-nguoc.hom-nay {
              background-color: rgba(139,111,71,0.12);
              color: var(--btn-primary);
          }

          .dem-nguoc.binh-thuong {
              background-color: var(--border);
              color: var(--text-sub);
          }

          .badge-ds {
              display: inline-block;
              font-size: 11px;
              padding: 2px 8px;
              border-radius: 20px;
              background-color: var(--border);
              color: var(--text-sub);
              font-weight: 600;
          }

          .input-sua {
              width: 100%;
              padding: 6px 8px;
              border: 2px solid var(--btn-primary);
              border-radius: 6px;
              font-size: 14px;
              background-color: var(--bg-card);
              color: var(--text-main);
              font-family: 'Lora', Georgia, serif;
          }

          .input-sua:focus { outline: none; }

          .nhom-nut {
              display: flex;
              gap: 6px;
              align-items: center;
              flex-shrink: 0;
          }

          li button {
              background: none;
              border: 1px solid var(--border-input);
              border-radius: 6px;
              font-size: 15px;
              cursor: pointer;
              padding: 2px 7px;
              color: var(--text-main);
              line-height: 1.4;
              transition: all 0.15s;
          }

          li button:hover {
              background-color: var(--btn-primary);
              color: var(--bg-card);
              border-color: var(--btn-primary);
          }

          .hoan-thanh .ten-cong-viec {
              text-decoration: line-through;
              color: var(--text-muted);
          }

          .hoan-thanh .gio-deadline { color: var(--text-muted); }
          .hoan-thanh .badge-ds { opacity: 0.4; }

          /* Empty state */
          .empty-state {
              text-align: center;
              padding: 40px 20px;
          }

          .empty-state .empty-icon {
              font-size: 48px;
              margin-bottom: 12px;
              opacity: 0.6;
          }

          .empty-state .empty-title {
              font-size: 16px;
              color: var(--text-main);
              margin-bottom: 6px;
          }

          .empty-state .empty-sub {
              font-size: 13px;
              color: var(--text-sub);
              font-style: italic;
          }

          /* Lịch */
          .lich-header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 8px;
          }

          .lich-header span {
              font-weight: 600;
              font-size: 16px;
              color: var(--text-main);
          }

          .btn-thang {
              background: none;
              border: 1px solid var(--border-input);
              border-radius: 6px;
              padding: 4px 10px;
              cursor: pointer;
              font-size: 16px;
              color: var(--text-main);
              transition: all 0.15s;
          }

          .btn-thang:hover {
              background-color: var(--btn-primary);
              color: var(--bg-card);
          }

          .lich-hom-nay-wrap {
              text-align: center;
              margin-bottom: 10px;
          }

          .lich-grid {
              display: grid;
              grid-template-columns: repeat(7, 1fr);
              gap: 4px;
          }

          .lich-thu {
              text-align: center;
              font-size: 12px;
              font-weight: 600;
              color: var(--text-sub);
              padding: 4px 0;
          }

          .lich-o {
              aspect-ratio: 1;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              border-radius: 8px;
              cursor: pointer;
              transition: background-color 0.15s;
              gap: 3px;
          }

          .lich-o:hover { background-color: var(--bg-item); }
          .lich-o.hom-nay { background-color: var(--btn-primary); }
          .lich-o.hom-nay .lich-so { color: var(--bg-card); }

          .lich-o.dang-chon {
              background-color: var(--bg-item);
              border: 2px solid var(--btn-primary);
          }

          .lich-o.hom-nay.dang-chon {
              background-color: var(--bg-item);
              border: 2px solid var(--btn-primary);
          }

          .lich-o.hom-nay.dang-chon .lich-so { color: var(--text-main); }
          .lich-o.hom-nay.dang-chon .cham { background-color: var(--text-sub); }
          .lich-o.thang-khac { opacity: 0.3; pointer-events: none; }

          .lich-so {
              font-size: 14px;
              color: var(--text-main);
              line-height: 1;
          }

          .lich-cham { display: flex; gap: 2px; }

          .cham {
              width: 5px;
              height: 5px;
              border-radius: 50%;
              background-color: var(--text-sub);
          }

          .lich-o.hom-nay .cham { background-color: var(--bg-card); opacity: 0.7; }

          .lich-panel {
              margin-top: 16px;
              border-top: 1px solid var(--border);
              padding-top: 14px;
          }

          .lich-panel-tieu-de {
              font-size: 13px;
              font-weight: 600;
              color: var(--text-sub);
              text-transform: uppercase;
              letter-spacing: 1px;
              margin-bottom: 8px;
          }

          .lich-task-item {
              display: flex;
              align-items: center;
              gap: 10px;
              padding: 8px 12px;
              background-color: var(--bg-item);
              border: 1px solid var(--border);
              border-radius: 8px;
              margin-top: 6px;
              cursor: pointer;
              transition: opacity 0.15s;
          }

          .lich-task-item:hover { opacity: 0.8; }

          .lich-task-ten {
              flex: 1;
              font-size: 14px;
              color: var(--text-main);
          }

          .lich-task-gio {
              font-size: 12px;
              color: var(--text-sub);
          }

          .lich-task-ds {
              font-size: 11px;
              padding: 2px 8px;
              border-radius: 20px;
              background-color: var(--border);
              color: var(--text-sub);
          }

          .lich-task-xoa {
              background: none;
              border: 1px solid var(--border-input);
              border-radius: 6px;
              font-size: 13px;
              padding: 2px 7px;
              cursor: pointer;
              color: var(--text-muted);
              flex-shrink: 0;
              transition: all 0.15s;
              line-height: 1.4;
          }

          .lich-task-xoa:hover {
              background-color: #e74c3c;
              border-color: #e74c3c;
              color: white;
          }

          .lich-task-item.da-xong .lich-task-ten {
              text-decoration: line-through;
              color: var(--text-muted);
          }

          .lich-trong {
              text-align: center;
              color: var(--text-sub);
              font-size: 14px;
              font-style: italic;
              padding: 20px 0;
          }

          /* Nút lưu trữ dưới danh sách */
          .luu-tru-footer {
              display: flex;
              align-items: center;
              justify-content: space-between;
              margin-top: 16px;
              padding-top: 12px;
              border-top: 1px solid var(--border);
          }

          .luu-tru-footer-gio {
              font-size: 12px;
              color: var(--text-muted);
              font-style: italic;
          }

          .btn-luu-tru {
              padding: 5px 14px;
              border: 1px solid var(--border-input);
              border-radius: 8px;
              background: transparent;
              font-size: 13px;
              cursor: pointer;
              color: var(--text-sub);
              transition: all 0.15s;
              font-family: 'Lora', Georgia, serif;
          }

          .btn-luu-tru:hover {
              background-color: var(--btn-primary);
              color: var(--bg-card);
              border-color: var(--btn-primary);
          }

          /* Lưu trữ */
          .luu-tru-wrap {
              margin-top: 20px;
              border-top: 1px solid var(--border);
              padding-top: 12px;
          }

          .luu-tru-header {
              display: flex;
              justify-content: space-between;
              align-items: center;
              cursor: pointer;
              padding: 6px 0;
              font-size: 14px;
              font-weight: 600;
              color: var(--text-sub);
              user-select: none;
          }

          .luu-tru-header:hover { color: var(--text-main); }

          .luu-tru-nhom {
              margin-top: 10px;
          }

          .luu-tru-ngay {
              font-size: 11px;
              font-weight: 600;
              color: var(--text-muted);
              text-transform: uppercase;
              letter-spacing: 1px;
              margin: 10px 0 4px;
          }

          .luu-tru-item {
              display: flex;
              align-items: center;
              gap: 8px;
              padding: 8px 12px;
              background-color: var(--bg-item);
              border: 1px solid var(--border);
              border-radius: 8px;
              margin-top: 4px;
              opacity: 0.75;
          }

          .luu-tru-ten {
              flex: 1;
              font-size: 14px;
              color: var(--text-sub);
              text-decoration: line-through;
          }

          .luu-tru-ds {
              font-size: 11px;
              padding: 2px 7px;
              border-radius: 20px;
              background-color: var(--border);
              color: var(--text-muted);
          }

          .btn-khoi-phuc {
              background: none;
              border: 1px solid var(--border-input);
              border-radius: 6px;
              font-size: 12px;
              padding: 2px 8px;
              cursor: pointer;
              color: var(--text-sub);
              white-space: nowrap;
              font-family: 'Lora', Georgia, serif;
              transition: all 0.15s;
          }

          .btn-khoi-phuc:hover {
              background-color: var(--btn-primary);
              color: var(--bg-card);
              border-color: var(--btn-primary);
          }

          .luu-tru-trong {
              font-size: 13px;
              color: var(--text-muted);
              font-style: italic;
              padding: 10px 0;
          }

          /* Mobile */
          @media (max-width: 480px) {
              body { padding: 0; align-items: flex-start; }

              .container {
                  border-radius: 0;
                  padding: 16px;
                  min-height: 100vh;
                  box-shadow: none;
              }

              h1 { font-size: 18px; }

              .input-row.hang-2 { flex-direction: column; }
              .thoi-gian-row { width: 100%; }

              .toolbar { flex-direction: column; align-items: stretch; }
              .toolbar > div { display: flex; gap: 6px; }
              .toolbar > div button { flex: 1; }
              select.chon-sap-xep { width: 100%; }

              .bo-loc {
                  flex-wrap: nowrap;
                  overflow-x: auto;
                  padding-bottom: 4px;
                  -webkit-overflow-scrolling: touch;
              }

              .btn-loc { white-space: nowrap; }
              li { font-size: 14px; padding: 8px 10px; }
              .tab { padding: 10px 16px; }
              .lich-so { font-size: 12px; }
              .cham { width: 4px; height: 4px; }
          }

          /* ===== Sổ tay: dòng kẻ + băng dính + tab ===== */
          .container {
              position: relative;
              background-image: repeating-linear-gradient(transparent 0 31px, color-mix(in srgb, var(--btn-primary) 14%, transparent) 31px 32px);
          }
          .container::after {
              content: ""; position: absolute; top: -10px; left: 50%; width: 96px; height: 22px;

          /* ===== Mặt bàn làm việc (nền + ánh sáng + đồ vật hai bên) ===== */

          .as-toi   { background: radial-gradient(circle at 10% 74%, rgba(255,196,120,0.30), transparent 34%),

          body[data-buoi="sang"]  .as-sang, body[data-buoi="sang"]  .as-bui,

          .bui { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,236,190,0.85); animation: troiBui linear infinite; }
          @keyframes troiBui { 0% { transform: translate(0,0); opacity: 0; } 20%,80% { opacity: 0.7; } 100% { transform: translate(40px,-60px); opacity: 0; } }

          .desk-side { position: absolute; top: 0; bottom: 0; width: calc((100vw - 800px) / 2); display: none;
                       flex-direction: column; align-items: center; justify-content: space-evenly; padding: 8vh 0; }
          .desk-left { left: 0; } .desk-right { right: 0; }
          @media (min-width: 1200px) { .desk-side { display: flex; } }
          .deco { color: var(--btn-primary); opacity: 0.55; width: clamp(90px, 9vw, 170px); height: auto; }
          .deco-pencil { transform: rotate(-24deg); width: clamp(110px, 11vw, 200px); }
          .deco-clip { transform: rotate(18deg); width: clamp(26px, 2.4vw, 40px); }
          .deco-glasses { transform: rotate(-8deg); }
          .deco-plant { width: clamp(100px, 10vw, 180px); }
          .steam { animation: hoiBay 3.2s ease-in-out infinite; transform-box: fill-box; }
          @keyframes hoiBay { 0% { opacity: 0; transform: translateY(6px); } 50% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-8px); } }
          @media (prefers-reduced-motion: reduce) { .steam, .bui { animation: none; } }

          /* ===== Cây theo tiến độ / Pomodoro / Polaroid ===== */
          .tuong-tac { pointer-events: auto; }

          .deco-plant .g.on { opacity: 1; transform: none; }
          .the-pomo { width: clamp(150px, 13vw, 210px); padding: 14px 12px; border-radius: 14px; text-align: center; color: var(--text-main);
                      background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow); }
