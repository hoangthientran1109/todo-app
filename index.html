                      <button class="btn-luu-tru" onclick="nhapDuLieu()" title="Khôi phục từ file sao lưu">⬆ Khôi phục</button>
                      <input type="file" id="file-nhap" accept=".json,application/json" style="display:none" onchange="docFileNhap(this)">
                      <button class="btn-luu-tru" onclick="copyHomNaySangNgayMai()">⧉ Copy → Ngày mai</button>
                  </div>
              </div>


          </div>
          <!-- Màn hình Lịch -->
          <div id="lich-tab" class="man-hinh">
              <div class="lich-header">
                  <button class="btn-thang" onclick="doiThang(-1)">‹</button>
                  <span id="tieu-de-thang"></span>
                  <button class="btn-thang" onclick="doiThang(1)">›</button>
              </div>
              <div class="lich-hom-nay-wrap">
                  <button class="btn-toolbar" onclick="veHomNay()">Hôm nay</button>
              </div>
              <div class="lich-grid" id="lich-grid"></div>
              <div class="lich-panel" id="lich-panel"></div>

              <!-- Lưu trữ: xem / khôi phục / xoá vĩnh viễn -->
              <div class="luu-tru-wrap">
                  <div class="luu-tru-header" onclick="batTatLuuTru()">
                      <span id="luu-tru-title">📦 Lưu trữ</span>
                      <span id="luu-tru-toggle">▸</span>
                  </div>
                  <div id="luu-tru-noi-dung" style="display:none"></div>
              </div>
          </div>

      </div>

      <!-- Modal xác nhận dùng chung -->
      <div id="modal-xac-nhan" class="modal-overlay" style="display:none">
          <div class="modal-box">
              <div class="modal-msg" id="modal-msg"></div>
              <div class="modal-nut">
                  <button class="btn-toolbar" id="modal-huy">Huỷ</button>
                  <button class="btn-modal-ok" id="modal-ok">Xóa</button>
              </div>
          </div>
      </div>

      <script>
          const DEFAULT_CATEGORIES = ["Work", "Study", "Health", "Relax"];

          // Khởi tạo data — localStorage là cache, Firebase sẽ override khi connect
          function docLocal(key, macDinh) {
              try {
                  let v = JSON.parse(localStorage.getItem(key));
                  return (v === null || v === undefined) ? macDinh : v;
              } catch (e) { return macDinh; }   // JSON hỏng thì không làm chết cả app
          }

          function taoId() {
              return Date.now() + "_" + Math.random().toString(36).slice(2);
          }

          // Chuẩn hoá: luôn là mảng, mỗi task có id + tên là chuỗi
          function chuanHoaTasks(arr) {
              if (!Array.isArray(arr)) return [];
              return arr.filter(t => t && typeof t === "object").map(function(t) {
                  if (!t.id) t.id = taoId();
                  t.tenCongViec = String(t.tenCongViec == null ? "" : t.tenCongViec);
                  return t;
              });
          }

          // So sánh ổn định: bỏ null, sắp key (Firebase trả key theo thứ tự khác + bỏ null)
          function chuoiOnDinh(v) {
              return JSON.stringify(v, function(k, val) {
                  if (val === null) return undefined;
                  if (val && typeof val === "object" && !Array.isArray(val)) {
                      return Object.keys(val).sort().reduce(function(o, key) { o[key] = val[key]; return o; }, {});
                  }
                  return val;
              });
          }

          // Task vừa thêm (chỉ để chạy animation) — không lưu vào data, không đụng Firebase
          const idMoi = new Set();

          let danhSachData = chuanHoaTasks(docLocal("todos", []));
          let locHienTai    = "tat-ca";
          let tuKhoaTimKiem = "";

          // Đảm bảo DEFAULT_CATEGORIES luôn có trong danhMucList
          let _savedCats = docLocal("categories", null);
          let danhMucList = (Array.isArray(_savedCats) && _savedCats.length > 0) ? _savedCats : [...DEFAULT_CATEGORIES];
          // Merge: thêm category mặc định nếu user chưa có
          DEFAULT_CATEGORIES.forEach(function(cat) {
              if (!danhMucList.includes(cat)) danhMucList.unshift(cat);
          });

          // Expose lên window để Firebase module script truy cập được
          window.danhSachData = danhSachData;
          window.danhMucList  = danhMucList;

          // ---- Nhận dữ liệu từ Firebase (module script gọi) ----
          window.nhanTasksTuCloud = function(tasks) {
              let moi = chuanHoaTasks(tasks);
              // Echo của chính mình / không có gì khác → bỏ qua, khỏi vẽ lại
              if (chuoiOnDinh(moi) === chuoiOnDinh(danhSachData)) return;
              danhSachData = moi;
              window.danhSachData = danhSachData;
              try { localStorage.setItem("todos", JSON.stringify(danhSachData)); } catch (e) {}
              // Đang sửa dở một task thì không vẽ lại để khỏi mất chữ đang gõ
              if (document.querySelector("#danh-sach .input-sua")) return;
              capNhatTatCaManHinh();
          };

          window.nhanDanhMucTuCloud = function(list) {
              if (list === null) return;   // cloud chưa có → giữ local
              let moi = Array.isArray(list) ? list.filter(x => typeof x === "string") : [];
              if (JSON.stringify(moi) === JSON.stringify(danhMucList)) return;
              danhMucList = moi;
              window.danhMucList = danhMucList;
              try { localStorage.setItem("categories", JSON.stringify(danhMucList)); } catch (e) {}
              if (locHienTai !== "tat-ca" && !danhMucList.includes(locHienTai)) locHienTai = "tat-ca";
              veThanhLoc();
              capNhatSelectDanhMuc();
              if (document.getElementById("panel-danh-muc").style.display !== "none") vePanelDanhMuc();
              veGiaoDien();
          };


          const PHUT_5 = ["00","05","10","15","20","25","30","35","40","45","50","55"];

          function h24To12(h24) {
              let h = parseInt(h24, 10);
              let ampm = h < 12 ? "AM" : "PM";
              let h12 = h % 12; if (h12 === 0) h12 = 12;
              return { h12: String(h12).padStart(2, "0"), ampm: ampm };
          }

          function h12To24(h12, ampm) {
              let h = parseInt(h12, 10);
              if (ampm === "AM") { if (h === 12) h = 0; }
              else { if (h !== 12) h += 12; }
              return String(h).padStart(2, "0");
          }

          (function initGioPhut() {
              let selGio   = document.getElementById("input-gio");
              let selPhut  = document.getElementById("input-phut");
              let selAmpm  = document.getElementById("input-ampm");
              selGio.innerHTML   = '<option value="">Giờ</option>';
              selPhut.innerHTML  = '<option value="">Phút</option>';
              selAmpm.innerHTML  = '<option value="">—</option>';
              for (let h = 1; h <= 12; h++) {
                  let o = document.createElement("option");
                  o.value = String(h).padStart(2, "0");
                  o.textContent = String(h).padStart(2, "0");
                  selGio.appendChild(o);
              }
              PHUT_5.forEach(function(m) {
                  let o = document.createElement("option");
                  o.value = m;
                  o.textContent = m;
                  selPhut.appendChild(o);
              });
              ["AM","PM"].forEach(function(v) {
                  let o = document.createElement("option");
                  o.value = v;
                  o.textContent = v;
                  selAmpm.appendChild(o);
              });
          })();

          function layDeadlineTuForm() {
              return layDeadlineTuFormSua(
                  document.getElementById("input-ngay"),
                  document.getElementById("input-gio"),
                  document.getElementById("input-phut"),
                  document.getElementById("input-ampm")
              );
          }

          function datVaoForm(dl) {
              let ngay  = document.getElementById("input-ngay");
              let gio   = document.getElementById("input-gio");
              let phut  = document.getElementById("input-phut");
              let ampm  = document.getElementById("input-ampm");
              if (!dl) { ngay.value = ""; gio.value = ""; phut.value = ""; ampm.value = ""; return; }
              let [d, t] = dl.split("T");
              ngay.value = d;
              if (t) {
                  let [h, m] = t.split(":");
                  let c = h24To12(h);
                  gio.value = c.h12;
                  ampm.value = c.ampm;
                  let snapped = String(Math.round(parseInt(m,10)/5)*5).padStart(2,"0");
                  if (snapped === "60") snapped = "55";
                  phut.value = snapped;
              } else {
                  gio.value = ""; phut.value = ""; ampm.value = "";
              }
          }

          function layDeadlineTuFormSua(ngayEl, gioEl, phutEl, ampmEl) {
              let ngay  = ngayEl.value;
              let gio   = gioEl.value;
              let phut  = phutEl.value;
              let ampm  = ampmEl.value;
              if (!ngay) return null;
              if (!gio && !phut) return ngay;
              let g = gio || "09";
              let a = ampm || "AM";
              let p = phut || "00";
              return ngay + "T" + h12To24(g, a) + ":" + p;
          }

          function taoHangGioPhut() {
              let row = document.createElement("div");
              row.className = "thoi-gian-row";
              let ngayEl = document.createElement("input");
              ngayEl.type = "date";
              ngayEl.className = "input-sua";
              let gioEl = document.createElement("select");
              gioEl.className = "input-sua";
              gioEl.innerHTML = '<option value="">Giờ</option>';
              for (let h = 1; h <= 12; h++) {
                  let o = document.createElement("option");
                  o.value = String(h).padStart(2, "0");
                  o.textContent = String(h).padStart(2, "0");
                  gioEl.appendChild(o);
              }
              let phutEl = document.createElement("select");
              phutEl.className = "input-sua";
              phutEl.innerHTML = '<option value="">Phút</option>';
              PHUT_5.forEach(function(m) {
                  let o = document.createElement("option");
                  o.value = m;
                  o.textContent = m;
                  phutEl.appendChild(o);
              });
              let ampmEl = document.createElement("select");
              ampmEl.className = "input-sua sel-ampm";
              ampmEl.innerHTML = '<option value="">—</option>';
              ["AM","PM"].forEach(function(v) {
                  let o = document.createElement("option");
                  o.value = v;
                  o.textContent = v;
                  ampmEl.appendChild(o);
              });
              row.appendChild(ngayEl);
              row.appendChild(gioEl);
              row.appendChild(phutEl);
              row.appendChild(ampmEl);
              return { row, ngayEl, gioEl, phutEl, ampmEl };
          }

          function datGioPhut(ngayEl, gioEl, phutEl, ampmEl, dl) {
              if (!dl) return;
              let [d, t] = dl.split("T");
              ngayEl.value = d;
              if (t) {
                  let [h, m] = t.split(":");
                  let c = h24To12(h);
                  gioEl.value = c.h12;
                  ampmEl.value = c.ampm;
                  let snapped = String(Math.round(parseInt(m,10)/5)*5).padStart(2,"0");
                  if (snapped === "60") snapped = "55";
                  phutEl.value = snapped;
              }
          }

          function luuDanhMuc() {
              try { localStorage.setItem("categories", JSON.stringify(danhMucList)); } catch (e) {}
              window.danhMucList = danhMucList;
              if (typeof window.syncToCloud === "function") window.syncToCloud("categories");
          }

          // ============================================
          // QUẢN LÝ DANH MỤC
          // ============================================
          function veThanhLoc() {
              let boLoc = document.getElementById("bo-loc");
              boLoc.innerHTML = "";

              let tatCaBtn = document.createElement("button");
              tatCaBtn.className = "btn-loc" + (locHienTai === "tat-ca" ? " active" : "");
              tatCaBtn.textContent = "Tất cả";
              tatCaBtn.dataset.loc = "tat-ca";
              tatCaBtn.onclick = function() { locTheoNut("tat-ca", tatCaBtn); };
              boLoc.appendChild(tatCaBtn);

              danhMucList.forEach(function(ten) {
                  let btn = document.createElement("button");
                  btn.className = "btn-loc" + (locHienTai === ten ? " active" : "");
                  btn.textContent = ten;
                  btn.dataset.loc = ten;
                  btn.onclick = function() { locTheoNut(ten, btn); };
                  boLoc.appendChild(btn);
              });
          }

          function locTheoNut(gia_tri, nut) {
              locHienTai = gia_tri;
              document.querySelectorAll("#bo-loc .btn-loc").forEach(b => b.classList.remove("active"));
              nut.classList.add("active");
              veGiaoDien();
          }

          function capNhatSelectDanhMuc() {
              // Cập nhật select trong form thêm
              let sel = document.getElementById("input-danh-sach");
              let curVal = sel.value;
              sel.innerHTML = '<option value="">— Danh sách —</option>';
              danhMucList.forEach(function(ten) {
                  let opt = document.createElement("option");
                  opt.value = ten;
                  opt.textContent = ten;
                  sel.appendChild(opt);
              });
              sel.value = curVal;
          }

          function vePanelDanhMuc() {
              let ds = document.getElementById("panel-dm-ds");
              ds.innerHTML = "";
              if (danhMucList.length === 0) {
                  ds.innerHTML = '<div style="font-size:13px;color:var(--text-sub);font-style:italic;padding:4px 0;">Chưa có danh sách nào</div>';
                  return;
              }
              danhMucList.forEach(function(ten) {
                  let row = document.createElement("div");
                  row.className = "panel-dm-item";

                  let label = document.createElement("span");
                  label.className = "panel-dm-ten";
                  label.textContent = ten;

                  let btnXoa = document.createElement("button");
                  btnXoa.textContent = "✕";
                  btnXoa.onclick = function() { xoaDanhMuc(ten); };

                  row.appendChild(label);
                  row.appendChild(btnXoa);
                  ds.appendChild(row);
              });
          }

          function batTatPanelDanhMuc() {
              let panel = document.getElementById("panel-danh-muc");
              let dang = panel.style.display !== "none";
              panel.style.display = dang ? "none" : "block";
              if (!dang) {
                  vePanelDanhMuc();
                  document.getElementById("input-ten-dm").focus();
              }
          }

          function themDanhMuc() {
              let input = document.getElementById("input-ten-dm");
              let ten = input.value.trim();
              if (ten === "") return;
              if (danhMucList.includes(ten)) {
                  alert("Danh sách \"" + ten + "\" đã tồn tại!");
                  return;
              }
              danhMucList.push(ten);
              luuDanhMuc();
              input.value = "";
              capNhatSelectDanhMuc();
              veThanhLoc();
              vePanelDanhMuc();
          }

          function xoaDanhMuc(ten) {
              let soTask = danhSachData.filter(t => t.danhSach === ten).length;
              let msg = soTask > 0
                  ? 'Xóa danh sách "' + ten + '"? ' + soTask + ' task đang dùng sẽ bị bỏ phân loại.'
                  : 'Xóa danh sách "' + ten + '"?';
              hienModal(msg, "Xóa", function() {
                  // Bỏ phân loại các task đang dùng
                  danhSachData.forEach(function(t) {
                      if (t.danhSach === ten) t.danhSach = null;
                  });
                  luuDuLieu();
                  danhMucList = danhMucList.filter(d => d !== ten);
                  luuDanhMuc();
                  if (locHienTai === ten) locHienTai = "tat-ca";
                  capNhatSelectDanhMuc();
                  veThanhLoc();
                  vePanelDanhMuc();
                  veGiaoDien();
              });
          }

          // ============================================
          // MODAL XÁC NHẬN
          // ============================================
          function hienModal(message, labelOk, callback, chiDong) {
              let overlay = document.getElementById("modal-xac-nhan");
              let msgEl = document.getElementById("modal-msg");
              msgEl.textContent = message;          // textContent: tên task chứa < > không bị hiểu thành HTML
              msgEl.style.whiteSpace = "pre-line";  // vẫn xuống dòng theo \n
              let btnOk  = document.getElementById("modal-ok");
              let btnHuy = document.getElementById("modal-huy");
              btnOk.textContent = labelOk || "Xóa";
              btnHuy.style.display = chiDong ? "none" : "";
              overlay.style.display = "flex";

              function dongModal() {
                  overlay.style.display = "none";
                  btnOk.onclick   = null;
                  btnHuy.onclick  = null;
                  overlay.onclick = null;
                  btnHuy.style.display = "";
              }

              btnOk.onclick  = function() { dongModal(); if (callback) callback(); };
              btnHuy.onclick = dongModal;
              overlay.onclick = function(e) { if (e.target === overlay) dongModal(); };
          }

          // ============================================
          // DARK MODE
          // ============================================
          function batTatDarkMode() {
              document.body.classList.toggle("dark");
              let isDark = document.body.classList.contains("dark");
              document.getElementById("btn-dark").textContent = isDark ? "☀️" : "🌙";
              localStorage.setItem("darkMode", isDark ? "on" : "off");
          }

          if (localStorage.getItem("darkMode") === "on") {
              document.body.classList.add("dark");
              document.getElementById("btn-dark").textContent = "☀️";
          }

          // ============================================
          // TABS
          // ============================================
          function chuyenTab(tabId, nut) {
              document.querySelectorAll(".man-hinh").forEach(m => m.classList.remove("active"));
              document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
              document.getElementById(tabId).classList.add("active");
              nut.classList.add("active");
              if (tabId === "lich-tab") {
                  veLich();
                  // Cập nhật số lượng lưu trữ trên tiêu đề
                  let soLT = danhSachData.filter(t => t.luuTru).length;
                  let el = document.getElementById("luu-tru-title");
                  if (el) el.textContent = "📦 Lưu trữ" + (soLT > 0 ? " (" + soLT + ")" : "");
                  if (luuTruMoDang) veLuuTru();
              } else {
                  veGiaoDien();   // đổi gì bên Lịch thì Danh sách luôn mới
              }
          }

          // ============================================
          // LỌC + TÌM KIẾM
          // ============================================
          function timKiem() {
              tuKhoaTimKiem = document.getElementById("input-tim-kiem").value.trim().toLowerCase();
              veGiaoDien();
          }

          function layDanhSachDaLoc() {
              let ketQua = danhSachData.filter(t => !t.luuTru);
              if (locHienTai !== "tat-ca") {
                  ketQua = ketQua.filter(task => task.danhSach === locHienTai);
              }
              if (tuKhoaTimKiem !== "") {
                  ketQua = ketQua.filter(task =>
                      task.tenCongViec.toLowerCase().includes(tuKhoaTimKiem)
                  );
              }
              return ketQua;
          }

          function escapeHtml(str) {
              return String(str).replace(/[&<>"']/g, function(c) {
                  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
              });
          }

          function highlight(text) {
              if (!tuKhoaTimKiem) return escapeHtml(text);
              let lower = text.toLowerCase(), out = "", i = 0, k = tuKhoaTimKiem.length;
              while (true) {
                  let j = lower.indexOf(tuKhoaTimKiem, i);
                  if (j === -1) break;
                  out += escapeHtml(text.slice(i, j)) + '<mark class="highlight">' + escapeHtml(text.slice(j, j + k)) + '</mark>';
                  i = j + k;
              }
              return out + escapeHtml(text.slice(i));
          }

          // ============================================
          // SẮP XẾP
          // ============================================
          function layDanhSachDaSapXep(ds) {
              let kieu = document.getElementById("chon-sap-xep").value;
              let ban  = [...ds];
              if (kieu === "deadline") {
                  return ban.sort(function(a, b) {
                      if (!a.deadline) return 1;
                      if (!b.deadline) return -1;
                      return a.deadline.localeCompare(b.deadline);
                  });
              }
              if (kieu === "ten-az") return ban.sort((a, b) => a.tenCongViec.localeCompare(b.tenCongViec, "vi"));
              if (kieu === "ten-za") return ban.sort((a, b) => b.tenCongViec.localeCompare(a.tenCongViec, "vi"));
              return ban;
          }

          // ============================================
          // ĐẾM TASK TRÊN THANH LỌC
          // ============================================
          function capNhatSoLuongLoc() {
              let boLoc = document.getElementById("bo-loc");
              if (!boLoc) return;
              boLoc.querySelectorAll(".btn-loc").forEach(function(nut) {
                  let val = nut.dataset.loc;
                  if (!val) return;
                  let label = val === "tat-ca" ? "Tất cả" : val;
                  let so    = val === "tat-ca"
                      ? danhSachData.filter(t => !t.luuTru).length
                      : danhSachData.filter(t => !t.luuTru && t.danhSach === val).length;
                  nut.textContent = so > 0 ? label + " (" + so + ")" : label;
              });
          }

          // ============================================
          // VẼ GIAO DIỆN
          // ============================================
          function veGiaoDien() {
              let container = document.getElementById("danh-sach");
              container.innerHTML = "";

              capNhatSoLuongLoc();

              let daDuocLoc = layDanhSachDaSapXep(layDanhSachDaLoc());

              if (daDuocLoc.length === 0) {
                  capNhatDem();
                  hienEmptyState();
                  return;
              }

              let coDeadline    = daDuocLoc.filter(t => t.deadline);
              let khongDeadline = daDuocLoc.filter(t => !t.deadline);

              let nhomTheoNgay = {};
              coDeadline.forEach(function(task) {
                  let ngay = task.deadline.split("T")[0];
                  if (!nhomTheoNgay[ngay]) nhomTheoNgay[ngay] = [];
                  nhomTheoNgay[ngay].push(task);
              });

              Object.keys(nhomTheoNgay).sort().forEach(function(ngay) {
                  let nhom   = document.createElement("div");
                  nhom.className = "nhom-ngay";

                  let headerContainer = document.createElement("div");
                  headerContainer.className = "tieu-de-ngay-container";

                  let tieuDe = document.createElement("div");
                  tieuDe.className = "tieu-de-ngay";

                  let homNay = layNgayHomNay();
                  if (ngay < homNay) {
                      tieuDe.classList.add("qua-han");
                      tieuDe.textContent = "Quá hạn — " + dinhDangNgay(ngay);
                  } else if (ngay === homNay) {
                      tieuDe.classList.add("hom-nay");
                      tieuDe.textContent = "Hôm nay — " + dinhDangNgay(ngay);
                  } else {
                      tieuDe.textContent = dinhDangNgay(ngay);
                  }

                  headerContainer.appendChild(tieuDe);

                  let nutLuuTru = document.createElement("button");
                  nutLuuTru.className = "btn-luu-tru-ngay";
                  nutLuuTru.textContent = "Lưu trữ";
                  nutLuuTru.onclick = function() { luuTruTheoNgay(ngay); };
                  headerContainer.appendChild(nutLuuTru);

                  nhom.appendChild(headerContainer);
                  let ul = document.createElement("ul");
                  nhomTheoNgay[ngay].forEach(function(task) {
                      ul.appendChild(taoLiElement(task));
                  });
                  nhom.appendChild(ul);
                  container.appendChild(nhom);
              });

              if (khongDeadline.length > 0) {
                  let nhom   = document.createElement("div");
                  nhom.className = "nhom-ngay";
                  let tieuDe = document.createElement("div");
                  tieuDe.className = "tieu-de-ngay";
                  tieuDe.textContent = "Chưa đặt deadline";
                  nhom.appendChild(tieuDe);
                  let ul = document.createElement("ul");
                  khongDeadline.forEach(function(task) {
                      ul.appendChild(taoLiElement(task));
                  });
                  nhom.appendChild(ul);
                  container.appendChild(nhom);
              }

              capNhatDem();
          }

          // ============================================
          // TẠO 1 DÒNG TASK
          // ============================================
          function taoLiElement(item) {
              let li     = document.createElement("li");
              let homNay = layNgayHomNay();

              if (item.deadline && item.deadline.split("T")[0] < homNay && !item.hoànThành) {
                  li.classList.add("qua-han");
              }

              let noiDung = document.createElement("div");
              noiDung.className = "noi-dung-task";
              if (item.hoànThành) noiDung.classList.add("hoan-thanh");
              if (item.hoànThành && idVuaXong.has(item.id)) { li.classList.add("vua-xong"); idVuaXong.delete(item.id); }

              let tenSpan = document.createElement("span");
              tenSpan.className = "ten-cong-viec";
              tenSpan.innerHTML = highlight(item.tenCongViec);
              noiDung.appendChild(tenSpan);

              if (item.deadline) {
                  let gioSpan = document.createElement("span");
                  gioSpan.className = "gio-deadline";
                  if (item.deadline.split("T")[0] < homNay && !item.hoànThành) {
                      gioSpan.classList.add("qua-han");
                  }
                  gioSpan.textContent = dinhDangGio(item.deadline);
                  if (gioSpan.textContent) noiDung.appendChild(gioSpan);   // deadline chỉ có ngày thì không có giờ

                  if (!item.hoànThành) {
                      let demNguoc = tinhDemNguoc(item.deadline);
                      if (demNguoc) {
                          let demSpan = document.createElement("span");
                          demSpan.className = "dem-nguoc " + demNguoc.loai;
                          demSpan.textContent = demNguoc.text;
                          noiDung.appendChild(demSpan);
                      }
                  }
              }

              if (item.danhSach) {
                  let badge = document.createElement("span");
                  badge.className = "badge-ds";
                  badge.textContent = item.danhSach;
                  noiDung.appendChild(badge);
              }

              if (item.lap) {
                  let bl = document.createElement("span"); bl.className = "badge-ds"; bl.textContent = "↻ lặp"; bl.title = "Task lặp lại";
                  noiDung.appendChild(bl);
              }
              if (item.con && item.con.length) {
                  let bc = document.createElement("span"); bc.className = "badge-ds";
                  bc.textContent = "☑ " + item.con.filter(c => c.xong).length + "/" + item.con.length;
                  noiDung.appendChild(bc);
              }

              noiDung.onclick = function() {
                  let idx = danhSachData.findIndex(t => t.id === item.id);
                  if (idx === -1) return;
                  doiTrangThai(danhSachData[idx]);
                  luuDuLieu();
                  veGiaoDien();
              };

              let nhomNut = document.createElement("div");
              nhomNut.className = "nhom-nut";

              let nutSua = document.createElement("button");
              nutSua.textContent = "✎";
              nutSua.title = "Sửa";
              nutSua.onclick = function() { batDauSua(li, item.id, noiDung); };

              let nutXoa = document.createElement("button");
              nutXoa.textContent = "✕";
              nutXoa.title = "Xóa";
              nutXoa.onclick = function() {
                  hienModal('Xóa task "' + item.tenCongViec + '"?', "Xóa", function() {
                      li.classList.add("dang-xoa");
                      setTimeout(function() {
                          let idx = danhSachData.findIndex(t => t.id === item.id);
                          if (idx !== -1) danhSachData.splice(idx, 1);
                          luuDuLieu();
                          veGiaoDien();
                      }, 200);
                  });
              };

              nhomNut.appendChild(nutSua);
              nhomNut.appendChild(nutXoa);
              li.appendChild(noiDung);
              li.appendChild(nhomNut);

              let nutCon = document.createElement("button");
              nutCon.textContent = "☑"; nutCon.title = "Các bước nhỏ";
              nutCon.onclick = function() {
                  if (idMoRong.has(item.id)) idMoRong.delete(item.id); else idMoRong.add(item.id);
                  veGiaoDien();
              };
              nhomNut.appendChild(nutCon);   // thêm CUỐI để batDauSua vẫn ẩn đúng nút ✎
              if (idMoRong.has(item.id)) { li.classList.add("co-con"); li.appendChild(taoPanelCon(item)); }

              ganSuKienKeoTha(li, item.id);
              if (idMoi.has(item.id)) {
                  li.classList.add("them-moi");
                  idMoi.delete(item.id);
              }
              return li;
          }

          // ============================================
          // SỬA TASK
          // ============================================
          function batDauSua(li, taskId, noiDung) {
              let index = danhSachData.findIndex(t => t.id === taskId);
              if (index === -1) return;
              noiDung.style.display = "none";

              let khoi = document.createElement("div");
              khoi.style.flex = "1";
              khoi.style.display = "flex";
              khoi.style.flexDirection = "column";
              khoi.style.gap = "6px";

               let inputSua = document.createElement("input");
               inputSua.type = "text";
               inputSua.className = "input-sua";
               inputSua.value = danhSachData[index].tenCongViec;

               let tp = taoHangGioPhut();
               datGioPhut(tp.ngayEl, tp.gioEl, tp.phutEl, tp.ampmEl, danhSachData[index].deadline);

               let selectSua = document.createElement("select");
               selectSua.className = "input-sua";
               selectSua.innerHTML = '<option value="">— Danh sách —</option>';
               danhMucList.forEach(function(ten) {
                   let opt = document.createElement("option");
                   opt.value = ten;
                   opt.textContent = ten;
                   selectSua.appendChild(opt);
               });
               selectSua.value = danhSachData[index].danhSach || "";

               khoi.appendChild(inputSua);
               khoi.appendChild(tp.row);
               khoi.appendChild(selectSua);
               let selectLap = document.createElement("select");
               selectLap.className = "input-sua";
               LAP_OPTS.forEach(function(o) { let op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; selectLap.appendChild(op); });
               selectLap.value = danhSachData[index].lap || "";
               khoi.appendChild(selectLap);

               let nutLuu = document.createElement("button");
               nutLuu.textContent = "✓";
               nutLuu.title = "Lưu";

               function luuSua() {
                   let noiDungMoi = inputSua.value.trim();
                   if (noiDungMoi === "") {
                       alert("Tên công việc không được để trống!");
                       return;
                   }
                   let idx = danhSachData.findIndex(t => t.id === taskId);
                   if (idx === -1) { veGiaoDien(); return; }   // task đã bị xoá từ thiết bị khác
                   danhSachData[idx].tenCongViec = noiDungMoi;
                   danhSachData[idx].deadline    = layDeadlineTuFormSua(tp.ngayEl, tp.gioEl, tp.phutEl, tp.ampmEl);
                   danhSachData[idx].danhSach    = selectSua.value || null;
                   danhSachData[idx].lap         = selectLap.value || null;
                  luuDuLieu();
                  veGiaoDien();
              }

              nutLuu.onclick = luuSua;
              inputSua.onkeydown = function(e) {
                  if (e.key === "Enter" && !e.isComposing) luuSua();   // isComposing: đang gõ Telex/VNI thì chưa lưu
                  if (e.key === "Escape") veGiaoDien();
              };

              let nhomNut = li.querySelector(".nhom-nut");
              li.insertBefore(khoi, nhomNut);
              nhomNut.insertBefore(nutLuu, nhomNut.firstChild);
              nhomNut.children[1].style.display = "none";

              inputSua.focus();
              inputSua.setSelectionRange(inputSua.value.length, inputSua.value.length);
          }

          // ============================================
          // KÉO THẢ
          // ============================================
          let idDangKeo = null;
          let liDangHover = null;

          function ganSuKienKeoTha(li, idTask) {

              li.draggable = true;
              li.dataset.id = idTask;

              li.ondragstart = function() {
                  idDangKeo = idTask;
                  setTimeout(() => li.classList.add("dang-keo"), 0);
              };

              li.ondragover = function(e) {
                  e.preventDefault();
                  if (liDangHover && liDangHover !== li) liDangHover.classList.remove("vi-tri-tha");
                  liDangHover = li;
                  li.classList.add("vi-tri-tha");
              };

              li.ondrop = function(e) {
                  e.preventDefault();
                  if (!idDangKeo || idDangKeo === idTask) return;

                  // Tìm index thật trong mảng gốc theo id
                  let indexKeo = danhSachData.findIndex(t => t.id === idDangKeo);
                  let indexTha = danhSachData.findIndex(t => t.id === idTask);

                  if (indexKeo === -1 || indexTha === -1) return;

                  let taskKeo = danhSachData.splice(indexKeo, 1)[0];
                  danhSachData.splice(indexTha, 0, taskKeo);

                  luuDuLieu();
                  veGiaoDien();
              };

              li.ondragend = function() {
                  idDangKeo = null;
                  liDangHover = null;
                  document.querySelectorAll("li").forEach(el => {
                      el.classList.remove("dang-keo");
                      el.classList.remove("vi-tri-tha");
                  });
              };
          }

          // ============================================
          // XÓA HÀNG LOẠT
          // ============================================
          function xoaTatCaHoanThanh() {
              let so = danhSachData.filter(t => t.hoànThành && !t.luuTru).length;
              if (so === 0) { alert("Không có task nào đã hoàn thành!"); return; }
              hienModal("Xóa " + so + " task đã hoàn thành?", "Xóa", function() {
                  danhSachData = danhSachData.filter(t => !(t.hoànThành && !t.luuTru));
                  luuDuLieu();
                  veGiaoDien();
              });
          }

          function xoaTatCa() {
              let dangHien = danhSachData.filter(t => !t.luuTru).length;
              if (dangHien === 0) { alert("Không có task nào!"); return; }
              hienModal("Xóa toàn bộ " + dangHien + " task? Không thể hoàn tác!\n(Task trong Lưu trữ được giữ nguyên.)", "Xóa tất cả", function() {
                  danhSachData = danhSachData.filter(t => t.luuTru);
                  luuDuLieu();
                  veGiaoDien();
              });
          }

          // ============================================
          // EMPTY STATE
          // ============================================
          const emptyMessages = [
              { icon: "☕", title: "Chưa có việc gì cả!", sub: "Pha tách cà phê rồi bắt đầu thôi..." },
              { icon: "✨", title: "Trang giấy trắng!", sub: "Mọi kế hoạch lớn đều bắt đầu từ đây." },
              { icon: "🌿", title: "Thảnh thơi quá!", sub: "Thêm task đầu tiên của ngày nào." },
              { icon: "📖", title: "Hôm nay chưa có gì!", sub: "Viết xuống để không quên nhé." }
          ];

          const emptyMsgHienTai = emptyMessages[Math.floor(Math.random() * emptyMessages.length)];

          function hienEmptyState() {
              let container = document.getElementById("danh-sach");
              let msg = emptyMsgHienTai;
              container.innerHTML = `
                  <div class="empty-state">
                      <div class="empty-icon">${msg.icon}</div>
                      <div class="empty-title">${msg.title}</div>
                      <div class="empty-sub">${msg.sub}</div>
                  </div>
              `;
          }

          // ============================================
          // PROGRESS BAR + ĐẾM
          // ============================================
          function capNhatDem() {
              // Thanh tiến độ chỉ tính task có deadline là HÔM NAY (copy sang ngày mai không làm nó nhảy)
              let homNay    = layNgayHomNay();
              let daDuocLoc = layDanhSachDaLoc().filter(t => toDateKeyFromDeadline(t.deadline) === homNay);
              let tatCa     = daDuocLoc.length;
              let hoànThành = daDuocLoc.filter(item => item.hoànThành).length;
              let chuaXong  = tatCa - hoànThành;
              let phanTram  = tatCa === 0 ? 0 : Math.round((hoànThành / tatCa) * 100);
              if (phanTram === 100 && tatCa > 0 && tatCaTruoc === tatCa && phanTramTruoc !== null && phanTramTruoc < 100) confetti();
              tatCaTruoc = tatCa; phanTramTruoc = phanTram;
              capNhatCay(tatCa, phanTram);

              let progressWrap = document.getElementById("progress-wrap");
              let dem          = document.getElementById("dem");
              let bar          = document.getElementById("progress-bar");
              let phanTramEl   = document.getElementById("dem-phan-tram");

              if (tatCa === 0) {
                  progressWrap.style.display = "none";
              } else {
                  progressWrap.style.display = "block";
                  dem.textContent = chuaXong === 0
                      ? "Hoàn thành tất cả " + tatCa + " task hôm nay! 🎉"
                      : hoànThành + "/" + tatCa + " task hôm nay hoàn thành";
                  phanTramEl.textContent = phanTram + "%";
                  bar.style.width = phanTram + "%";
                  phanTram === 100
                      ? bar.classList.add("full")
                      : bar.classList.remove("full");
              }
          }

          // ============================================
          // ĐẾM NGƯỢC DEADLINE
          // ============================================
          function tinhDemNguoc(deadline) {
              if (!deadline || deadline.indexOf("T") === -1) return null;   // chỉ có ngày → không có giờ để đếm
              let bayGio    = new Date();
              let hetHan    = new Date(deadline);
              let conLaiMs  = hetHan - bayGio;
              if (conLaiMs < 0) return null;

              let conLaiPhut = Math.floor(conLaiMs / 1000 / 60);
              let conLaiGio  = Math.floor(conLaiPhut / 60);
              let conLaiNgay = Math.floor(conLaiGio / 24);

              if (conLaiPhut < 60) {
                  return { text: "còn " + conLaiPhut + " phút", loai: "gap" };
              } else if (conLaiGio < 24) {
                  let phutDu = conLaiPhut % 60;
                  let chuoi  = "còn " + conLaiGio + " giờ";
                  if (phutDu > 0) chuoi += " " + phutDu + " phút";
                  return { text: chuoi, loai: "hom-nay" };
              } else if (conLaiNgay <= 3) {
                  return { text: "còn " + conLaiNgay + " ngày", loai: "binh-thuong" };
              }
              return null;
          }

          // ============================================
          // LỊCH
          // ============================================
          let thangHienTai = new Date().getMonth();
          let namHienTai   = new Date().getFullYear();
          let ngayDangChon = null;

          function doiThang(delta) {
              thangHienTai += delta;
              if (thangHienTai > 11) { thangHienTai = 0; namHienTai++; }
              if (thangHienTai < 0)  { thangHienTai = 11; namHienTai--; }
              veLich();
          }

          function veHomNay() {
              thangHienTai = new Date().getMonth();
              namHienTai   = new Date().getFullYear();
              ngayDangChon = layNgayHomNay();
              veLich();   // veLich đã tự hiện task của ngày đang chọn
          }

          function veLich() {
              let grid   = document.getElementById("lich-grid");
              let tieuDe = document.getElementById("tieu-de-thang");
              grid.innerHTML = "";

              let tenThang = ["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6",
                              "Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
              tieuDe.textContent = tenThang[thangHienTai] + " " + namHienTai;

              ["CN","T2","T3","T4","T5","T6","T7"].forEach(function(thu) {
                  let o = document.createElement("div");
                  o.className = "lich-thu";
                  o.textContent = thu;
                  grid.appendChild(o);
              });

              let ngayDauThang     = new Date(namHienTai, thangHienTai, 1).getDay();
              let soNgayTrongThang = new Date(namHienTai, thangHienTai + 1, 0).getDate();
              let soNgayThangTruoc = new Date(namHienTai, thangHienTai, 0).getDate();
              let homNayStr        = layNgayHomNay();

              let taskTheoNgay = {};
              danhSachData.forEach(function(task) {
                  if (!task.deadline || task.luuTru) return;   // task đã lưu trữ không hiện trên lịch
                  let ngay = task.deadline.split("T")[0];
                  if (!taskTheoNgay[ngay]) taskTheoNgay[ngay] = [];
                  taskTheoNgay[ngay].push(task);
              });

              for (let i = 0; i < ngayDauThang; i++) {
                  let so = soNgayThangTruoc - ngayDauThang + 1 + i;
                  let o  = document.createElement("div");
                  o.className = "lich-o thang-khac";
                  o.innerHTML = `<span class="lich-so">${so}</span>`;
                  grid.appendChild(o);
              }

              for (let ngay = 1; ngay <= soNgayTrongThang; ngay++) {
                  let thangStr = String(thangHienTai + 1).padStart(2, "0");
                  let ngayStr  = String(ngay).padStart(2, "0");
                  let ngayDay  = namHienTai + "-" + thangStr + "-" + ngayStr;

                  let o = document.createElement("div");
                  o.className = "lich-o";
                  if (ngayDay === homNayStr)    o.classList.add("hom-nay");
                  if (ngayDay === ngayDangChon) o.classList.add("dang-chon");

                  let soEl = document.createElement("span");
                  soEl.className = "lich-so";
                  soEl.textContent = ngay;
                  o.appendChild(soEl);

                  if (taskTheoNgay[ngayDay]) {
                      let chamRow = document.createElement("div");
                      chamRow.className = "lich-cham";
                      let soTask = Math.min(taskTheoNgay[ngayDay].length, 3);
                      for (let c = 0; c < soTask; c++) {
                          let cham = document.createElement("div");
                          cham.className = "cham";
                          chamRow.appendChild(cham);
                      }
                      o.appendChild(chamRow);
                  }

                  o.onclick = function() {
                      ngayDangChon = ngayDay;
                      veLich();
                  };

                  grid.appendChild(o);
              }

              let tongO   = ngayDauThang + soNgayTrongThang;
              let oConLai = tongO % 7 === 0 ? 0 : 7 - (tongO % 7);
              for (let i = 1; i <= oConLai; i++) {
                  let o = document.createElement("div");
                  o.className = "lich-o thang-khac";
                  o.innerHTML = `<span class="lich-so">${i}</span>`;
                  grid.appendChild(o);
              }

              if (ngayDangChon) hienTaskCuaNgay(ngayDangChon);
              capNhatTieuDeLuuTru();
          }

          function hienTaskCuaNgay(ngayDay) {
              let panel = document.getElementById("lich-panel");
              panel.innerHTML = "";

              let [nam, thang, ngay] = ngayDay.split("-");

              let taskHom = danhSachData.filter(function(task) {
                  return !task.luuTru && task.deadline && task.deadline.split("T")[0] === ngayDay;
              });

              // Header: tiêu đề + nút xóa tất cả
              let header = document.createElement("div");
              header.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;";

              let tieuDe = document.createElement("div");
              tieuDe.className = "lich-panel-tieu-de";
              tieuDe.style.marginBottom = "0";
              tieuDe.textContent = "Ngày " + ngay + "/" + thang;
              header.appendChild(tieuDe);

              if (taskHom.length > 0) {
                  let btnXoaTatCa = document.createElement("button");
                  btnXoaTatCa.className = "btn-toolbar nguy-hiem";
                  btnXoaTatCa.style.fontSize = "12px";
                  btnXoaTatCa.textContent = "✕ Xóa tất cả";
                  btnXoaTatCa.onclick = function() {
                      hienModal("Xóa toàn bộ " + taskHom.length + " task ngày " + ngay + "/" + thang + "?", "Xóa tất cả", function() {
                          let ids = taskHom.map(t => t.id);
                          danhSachData = danhSachData.filter(t => !ids.includes(t.id));
                          luuDuLieu();
                          veLich();
                      });
                  };
                  header.appendChild(btnXoaTatCa);
              }

              panel.appendChild(header);

              if (taskHom.length === 0) {
                  let trong = document.createElement("div");
                  trong.className = "lich-trong";
                  trong.textContent = "Không có task nào";
                  panel.appendChild(trong);
                  return;
              }

              taskHom.sort((a, b) => a.deadline.localeCompare(b.deadline));

              taskHom.forEach(function(task) {
                  let item = document.createElement("div");
                  item.className = "lich-task-item";
                  if (task.hoànThành) item.classList.add("da-xong");

                  let gio = document.createElement("span");
                  gio.className = "lich-task-gio";
                  gio.textContent = dinhDangGio(task.deadline) || "Cả ngày";

                  let ten = document.createElement("span");
                  ten.className = "lich-task-ten";
                  ten.textContent = task.tenCongViec;

                  // Click vào tên/giờ để toggle hoàn thành
                  let clickArea = document.createElement("div");
                  clickArea.style.cssText = "display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;";
                  clickArea.appendChild(gio);
                  clickArea.appendChild(ten);
                  clickArea.onclick = function() {
                      let t = danhSachData.find(x => x.id === task.id);
                      if (!t) return;
                      doiTrangThai(t);
                      luuDuLieu();
                      veLich();
                  };

                  item.appendChild(clickArea);

                  if (task.danhSach) {
                      let ds = document.createElement("span");
                      ds.className = "lich-task-ds";
                      ds.textContent = task.danhSach;
                      item.appendChild(ds);
                  }

                  // Nút xóa từng task
                  let btnXoa = document.createElement("button");
                  btnXoa.className = "lich-task-xoa";
                  btnXoa.textContent = "✕";
                  btnXoa.title = "Xóa";
                  btnXoa.onclick = function(e) {
                      e.stopPropagation();
                      hienModal('Xóa task "' + task.tenCongViec + '"?', "Xóa", function() {
                          let idx = danhSachData.findIndex(t => t.id === task.id);
                          if (idx !== -1) danhSachData.splice(idx, 1);
                          luuDuLieu();
                          veLich();
                      });
                  };
                  item.appendChild(btnXoa);

                  panel.appendChild(item);
              });
          }

          // ============================================
          // NHẮC DEADLINE TRƯỚC 15 PHÚT
          // ============================================
          // Xin quyền ở lần chạm đầu tiên (iOS Safari bắt buộc có thao tác người dùng)
          if ("Notification" in window && Notification.permission === "default") {
              document.addEventListener("click", function() {
                  try { Notification.requestPermission(); } catch (e) {}
              }, { once: true });
          }

          let daNhac = docLocal("daNhac", {});

          function kiemTraDeadline() {
              if (!("Notification" in window) || Notification.permission !== "granted") return;
              let bayGio = new Date();

              // Dọn các mốc đã nhắc của task không còn tồn tại (khỏi phình localStorage)
              let hopLe = {};
              danhSachData.forEach(function(t) { if (t.deadline) hopLe[t.deadline + t.tenCongViec] = true; });
              let doi = false;
              Object.keys(daNhac).forEach(function(k) { if (!hopLe[k]) { delete daNhac[k]; doi = true; } });

              danhSachData.forEach(function(task) {
                  if (!task.deadline || task.deadline.indexOf("T") === -1 || task.hoànThành) return;
                  let hetHan  = new Date(task.deadline);
                  let conLai  = (hetHan - bayGio) / 1000 / 60;
                  let key     = task.deadline + task.tenCongViec;
                  if (conLai > 0 && conLai <= 15 && !daNhac[key]) {
                      new Notification("⏰ Sắp đến hạn!", {
                          body: "\"" + task.tenCongViec + "\" còn 15 phút nữa!"
                      });
                      daNhac[key] = true;
                      doi = true;
                  }
              });
              if (doi) { try { localStorage.setItem("daNhac", JSON.stringify(daNhac)); } catch (e) {} }
          }

          setInterval(kiemTraDeadline, 60 * 1000);
          kiemTraDeadline();

          // Làm mới đếm ngược / mốc "Hôm nay" mỗi phút (không làm khi đang sửa, đang kéo hoặc tab ẩn)
          setInterval(function() {
              if (document.hidden || idDangKeo) return;
              if (document.querySelector("#danh-sach .input-sua")) return;
              if (document.getElementById("danh-sach-tab").classList.contains("active")) veGiaoDien();
          }, 60 * 1000);

              let mo = String(now.getMonth() + 1).padStart(2, "0");
              el.textContent = d + "/" + mo + " " + h + ":" + m;
          }
          capNhatGioLuuTru();
          setInterval(capNhatGioLuuTru, 60000);

          function luuTruTatCa() {
              let chuaLuu = danhSachData.filter(t => !t.luuTru);

                  hienModal("Không có task nào để lưu trữ!", "Đóng", function() {}, true);

          // ============================================
          // LƯU TRỮ
          // ============================================
          let luuTruMoDang = false;

          function batTatLuuTru() {

          function veLuuTru() {
              let wrap = document.getElementById("luu-tru-noi-dung");
              wrap.innerHTML = "";

              let dsLuuTru = danhSachData.filter(t => t.luuTru);

                  trong.textContent = "Chưa có task nào được lưu trữ";
                  wrap.appendChild(trong);
                  return;
              }

              // Nhóm theo ngày lưu trữ
              let nhom = {};

                  if (!nhom[ngay]) nhom[ngay] = [];

                  tieuDeNgay.className = "luu-tru-ngay";

                  } else {
                      tieuDeNgay.textContent = ngay;
                  }

                              delete danhSachData[idx].ngayLuuTru;

                          luuDuLieu();
                          veGiaoDien();
                          veLich();
                          veLuuTru();

          // ============================================
          // KHỞI TẠO UI + EXPOSE LÊN WINDOW CHO FIREBASE
          // ============================================
          function _init() {
              veGiaoDien();
              veThanhLoc();
              capNhatSelectDanhMuc();
          }

          // ============================================
          // TÍNH NĂNG MỚI: lặp lại, bước nhỏ, theme, header, hiệu ứng
          // ============================================
          const idVuaXong = new Set();   // task vừa tick xong (chỉ để chạy animation)
          const idMoRong  = new Set();   // task đang mở panel bước nhỏ
          let phanTramTruoc = null, tatCaTruoc = null;
          const LAP_OPTS = [["", "Không lặp"], ["ngay", "Hằng ngày"], ["tuan", "Hằng tuần"], ["t2t6", "Thứ 2 → Thứ 6"]];

          function khoaNgay(dt) {
              return dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
          }

          // Ngày kế tiếp của task lặp: luôn sau cả deadline cũ lẫn hôm nay (làm trễ thì không đẻ ra task quá hạn)
          function ngayLapTiep(dateKey, lap) {
              const [y, m, d] = dateKey.split("-").map(Number);
              const dt = new Date(y, m - 1, d);
              const hn = layNgayHomNay();
              const moc = dateKey > hn ? dateKey : hn;
              do {
                  dt.setDate(dt.getDate() + (lap === "tuan" ? 7 : 1));
                  if (lap === "t2t6") while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate() + 1);
              } while (khoaNgay(dt) <= moc);
              return khoaNgay(dt);
          }

          function copyCon(t) {
              if (!t.con || !t.con.length) return undefined;
              return t.con.map(c => ({ id: taoId(), ten: c.ten, xong: false }));
          }

          // Đổi trạng thái xong/chưa; xong một task lặp lại → tự tạo task kỳ sau (có chống trùng)
          function doiTrangThai(t) {
              t.hoànThành = !t.hoànThành;
              if (!t.hoànThành) return;
              idVuaXong.add(t.id);
              if (!t.lap) return;
              const next = ngayLapTiep(toDateKeyFromDeadline(t.deadline) || layNgayHomNay(), t.lap);
              const trung = danhSachData.some(x => x.id !== t.id && x.tenCongViec === t.tenCongViec &&
                  (x.danhSach || "") === (t.danhSach || "") && toDateKeyFromDeadline(x.deadline) === next);
              if (trung) return;
              const time = t.deadline && t.deadline.split("T")[1];
              const id = taoId();
              idMoi.add(id);
              danhSachData.push({ id: id, tenCongViec: t.tenCongViec, hoànThành: false,
                  deadline: time ? next + "T" + time : next, danhSach: t.danhSach || null, lap: t.lap, con: copyCon(t) });
          }

          // ---- Bước nhỏ (checklist) ----
          function luuSauSuaCon(id, fn) {
              const t = danhSachData.find(x => x.id === id);
              if (!t) return;
              fn(t);
              const ds = t.con || [];
              const xongHet = ds.length > 0 && ds.every(c => c.xong);
              if (xongHet && !t.hoànThành) doiTrangThai(t);                 // tick hết → task tự xong
              else if (!xongHet && t.hoànThành && ds.length) t.hoànThành = false;
              luuDuLieu();
              veGiaoDien();
          }

          function taoPanelCon(item) {
              const box = document.createElement("div");
              box.className = "panel-con";
              (item.con || []).forEach(function(c) {
                  const row = document.createElement("div");
                  row.className = "con-item" + (c.xong ? " xong" : "");
                  const cb = document.createElement("input");
                  cb.type = "checkbox"; cb.checked = !!c.xong;
                  cb.onchange = () => luuSauSuaCon(item.id, t => { const x = t.con.find(y => y.id === c.id); if (x) x.xong = cb.checked; });
                  const ten = document.createElement("span");
                  ten.textContent = c.ten;
                  const xoa = document.createElement("button");
                  xoa.textContent = "✕"; xoa.title = "Xoá bước";
                  xoa.onclick = () => luuSauSuaCon(item.id, t => { t.con = t.con.filter(y => y.id !== c.id); });
                  row.append(cb, ten, xoa);
                  box.appendChild(row);
              });
              const inp = document.createElement("input");
              inp.type = "text"; inp.className = "con-input"; inp.placeholder = "Thêm bước nhỏ...";
              inp.onkeydown = function(e) {
                  if (e.key !== "Enter" || e.isComposing) return;
                  const v = inp.value.trim();
                  if (!v) return;
                  luuSauSuaCon(item.id, t => { (t.con = t.con || []).push({ id: taoId(), ten: v, xong: false }); });
                  const again = document.querySelector('li[data-id="' + item.id + '"] .con-input');
                  if (again) again.focus();
              };
              box.appendChild(inp);
              return box;
          }

          // ---- Theme màu (bấm 🎨 để đổi vòng: nâu kem → matcha → hồng → xanh đêm) ----
          const THEMES = ["", "matcha", "hong", "dem"];
          function datTheme(t) {
              if (!THEMES.includes(t)) t = "";
              if (t) document.body.dataset.theme = t; else delete document.body.dataset.theme;
              try { localStorage.setItem("theme", JSON.stringify(t)); } catch (e) {}
          }
          function doiTheme() {
              datTheme(THEMES[(THEMES.indexOf(document.body.dataset.theme || "") + 1) % THEMES.length]);
          }
          datTheme(docLocal("theme", ""));

          // ---- Header: lời chào + ngày + câu trích ----
          function veHeader() {
              const el = document.getElementById("header-sub");
              if (!el) return;
              const QUOTES = [
                  "Mỗi ngày xong một việc nhỏ, cuối tuần sẽ thấy một bước dài.",
                  "Bắt đầu trước, hoàn hảo tính sau.",

                  "Nghỉ đúng lúc cũng là một phần của làm việc.",
                  "Hôm nay xong một việc quan trọng là đã đủ đẹp.",
                  "Kỷ luật là món quà gửi cho chính mình của ngày mai."
              ];
              const n = new Date(), h = n.getHours();

              const thu = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"][n.getDay()];
              const ngayTrongNam = Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5);
              el.innerHTML = '<div><span class="hs-greet">' + chao + '</span> · ' + thu + ', ' + dinhDangNgay(layNgayHomNay()) + '/' + n.getFullYear() +
                             '</div><div class="hs-quote">“' + QUOTES[ngayTrongNam % QUOTES.length] + '”</div>';
          }
          setInterval(veHeader, 60 * 1000);

          // ---- Confetti khi xong hết task hôm nay ----
          function confetti() {
              if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
              const mau = ["#e74c3c", "#f1c40f", "#2ecc71", "#3498db", "#9b59b6", "#e67e22"];
              for (let i = 0; i < 40; i++) {
                  const p = document.createElement("i");
                  p.className = "confetti";
                  p.style.cssText = "left:" + (Math.random() * 100) + "vw;background:" + mau[i % mau.length] +
                      ";--dx:" + (Math.random() * 160 - 80) + "px;--r:" + (Math.random() * 720) + "deg;" +
                      "animation-delay:" + (Math.random() * 0.3) + "s;animation-duration:" + (1.6 + Math.random() * 1.2) + "s";
                  document.body.appendChild(p);
                  setTimeout(() => p.remove(), 3500);
              }
          }

          // ---- Sao lưu / khôi phục bằng file JSON ----
          function xuatDuLieu() {
              const data = { phienBan: 1, xuatLuc: new Date().toISOString(), tasks: danhSachData, categories: danhMucList };
              const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
              const a = document.createElement("a");
              a.href = url;
              a.download = "todo-backup-" + layNgayHomNay() + ".json";
              document.body.appendChild(a);
              a.click();
              a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
          }

          function nhapDuLieu() { document.getElementById("file-nhap").click(); }

          function docFileNhap(input) {
              const f = input.files[0];
              input.value = "";
              if (!f) return;
              const r = new FileReader();
              r.onload = function() {
                  let d;
                  try { d = JSON.parse(r.result); } catch (e) { hienModal("File không đọc được (không phải JSON hợp lệ).", "OK", null, true); return; }
                  if (!d || !Array.isArray(d.tasks)) { hienModal("File này không phải bản sao lưu của app.", "OK", null, true); return; }
                  hienModal("Khôi phục " + d.tasks.length + " task từ file?\nDữ liệu hiện tại sẽ bị thay thế.", "Khôi phục", function() {
                      danhSachData = chuanHoaTasks(d.tasks);
                      if (Array.isArray(d.categories)) {
                          danhMucList = d.categories.filter(x => typeof x === "string");
                          luuDanhMuc();
                          capNhatSelectDanhMuc();
                          veThanhLoc();
                      }
                      luuDuLieu();
                      capNhatTatCaManHinh();
                  });
              };
              r.readAsText(f);
          }

          // ---- Tự thêm task lặp lại cho hôm nay (chạy khi mở app, mỗi phút và khi quay lại tab) ----
          function buocLap(dateKey, lap) {
              const [y, m, d] = dateKey.split("-").map(Number);
              const dt = new Date(y, m - 1, d);
              dt.setDate(dt.getDate() + (lap === "tuan" ? 7 : 1));
              if (lap === "t2t6") while (dt.getDay() === 0 || dt.getDay() === 6) dt.setDate(dt.getDate() + 1);
              return khoaNgay(dt);
          }

          function tuTaoTaskLap() {
              const hn = layNgayHomNay();
              const chuoi = {};   // mỗi chuỗi = cùng tên + cùng danh sách; lấy task có ngày muộn nhất
              danhSachData.forEach(function(t) {
                  const day = toDateKeyFromDeadline(t.deadline);
                  if (!day) return;
                  const k = t.tenCongViec + "|" + (t.danhSach || "");
                  if (!chuoi[k] || day > chuoi[k].day) chuoi[k] = { t: t, day: day };
              });
              let them = 0;
              Object.values(chuoi).forEach(function(c) {
                  if (!c.t.lap || c.day >= hn) return;   // không lặp, hoặc đã có kỳ hôm nay/tương lai
                  let next = c.day;
                  do { next = buocLap(next, c.t.lap); } while (next < hn);   // giữ nhịp lặp, lấy kỳ đầu tiên từ hôm nay
                  const time = c.t.deadline.split("T")[1];
                  const id = taoId();
                  idMoi.add(id);
                  danhSachData.push({ id: id, tenCongViec: c.t.tenCongViec, hoànThành: false,
                      deadline: time ? next + "T" + time : next, danhSach: c.t.danhSach || null, lap: c.t.lap, con: copyCon(c.t) });
                  them++;
              });
              if (them) { luuDuLieu(); capNhatTatCaManHinh(); }
          }
          setInterval(tuTaoTaskLap, 60 * 1000);
          document.addEventListener("visibilitychange", function() { if (!document.hidden) tuTaoTaskLap(); });

          // ---- Ánh sáng theo giờ + hạt bụi trong nắng ----
          function veAnhSang() {
              const h = new Date().getHours();
              document.body.dataset.buoi = (h >= 5 && h < 11) ? "sang" : (h >= 11 && h < 15) ? "trua" : (h >= 15 && h < 18) ? "chieu" : "toi";
          }
          (function() {
              const box = document.getElementById("as-bui");
              if (!box) return;
              for (let i = 0; i < 12; i++) {
                  const b = document.createElement("i");
                  b.className = "bui";
                  b.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (20 + Math.random() * 70) + "%;" +
                      "animation-duration:" + (18 + Math.random() * 16) + "s;animation-delay:-" + (Math.random() * 30) + "s";
                  box.appendChild(b);
              }
          })();
          setInterval(veAnhSang, 60 * 1000);
          veAnhSang();

          // ---- Cây lớn theo tiến độ hôm nay ----
          function capNhatCay(tatCa, pct) {
              const cay = document.getElementById("cay");
              if (!cay) return;
              const lv = (!tatCa || pct === 0) ? 0 : pct <= 25 ? 1 : pct <= 50 ? 2 : pct <= 75 ? 3 : pct < 100 ? 4 : 5;
              cay.querySelectorAll("[data-g]").forEach(e => e.classList.toggle("on", +e.dataset.g <= lv));
              const t = cay.querySelector("title");
              if (t) t.textContent = tatCa ? "Hôm nay xong " + pct + "%" : "Hôm nay chưa có task";
          }

          // ---- Đồng hồ + Pomodoro ----
          const POMO_GIAY = { tt: 25 * 60, nghi: 5 * 60 };
          const TIEU_DE_GOC = document.title;
          let pomo = { che: "tt", conLai: POMO_GIAY.tt, chay: false, ketThuc: 0 };
          const hai = n => String(n).padStart(2, "0");

          function pomoTenTask() {
              const hn = layNgayHomNay();
              const ds = danhSachData.filter(t => !t.luuTru && !t.hoànThành && toDateKeyFromDeadline(t.deadline) === hn)
                  .sort((a, b) => String(a.deadline).localeCompare(String(b.deadline)));
              return ds.length ? ds[0].tenCongViec : "";
          }

          function pomoVe() {
              const dem = document.getElementById("pomo-dem");
              if (!dem) return;
              const txt = hai(Math.floor(pomo.conLai / 60)) + ":" + hai(pomo.conLai % 60);
              dem.textContent = txt;
              document.getElementById("pomo-che-do").textContent = pomo.che === "tt" ? "Tập trung" : "Nghỉ ngơi";
              document.getElementById("pomo-bt").textContent = pomo.chay ? "⏸ Tạm dừng" : "▶ Bắt đầu";
              document.title = pomo.chay ? txt + " · " + TIEU_DE_GOC : TIEU_DE_GOC;
          }

          function pomoBip() {
              try {
                  const c = new (window.AudioContext || window.webkitAudioContext)();
                  const o = c.createOscillator(), g = c.createGain();
                  o.frequency.value = 880; g.gain.value = 0.15;
                  o.connect(g); g.connect(c.destination); o.start();
                  setTimeout(() => { o.stop(); c.close(); }, 600);
              } catch (e) {}
          }

          function pomoBatDau() {
              if (pomo.chay) pomo.conLai = Math.max(0, Math.ceil((pomo.ketThuc - Date.now()) / 1000));
              else pomo.ketThuc = Date.now() + pomo.conLai * 1000;
              pomo.chay = !pomo.chay;
              pomoVe();
          }
          function pomoReset() { pomo.chay = false; pomo.conLai = POMO_GIAY[pomo.che]; pomoVe(); }
          function pomoDoiCheDo() { pomo.che = pomo.che === "tt" ? "nghi" : "tt"; pomoReset(); }

          function pomoTick() {
              const gio = document.getElementById("pomo-gio");
              if (!gio) return;
              const n = new Date();
              gio.textContent = hai(n.getHours()) + ":" + hai(n.getMinutes());
              const tenTask = pomoTenTask();
              const elT = document.getElementById("pomo-task");
              if (elT.textContent !== tenTask) { elT.textContent = tenTask; elT.title = tenTask; }
              if (pomo.chay) {
                  pomo.conLai = Math.ceil((pomo.ketThuc - Date.now()) / 1000);
                  if (pomo.conLai <= 0) {
                      const vuaTT = pomo.che === "tt";
                      pomo.che = vuaTT ? "nghi" : "tt";
                      pomo.chay = false;
                      pomo.conLai = POMO_GIAY[pomo.che];
                      pomoBip();
                      if ("Notification" in window && Notification.permission === "granted") {
                          new Notification(vuaTT ? "🍅 Hết giờ tập trung!" : "⏰ Hết giờ nghỉ!", { body: vuaTT ? "Nghỉ 5 phút nhé." : "Sẵn sàng tập trung tiếp." });
                      }
                  }
              }
              pomoVe();
          }
          setInterval(pomoTick, 1000);
          pomoTick();

          // ---- Polaroid: ảnh nén nhỏ, lưu trong localStorage ----
          function dungPolaroid(i) {
              const el = document.getElementById("pol-" + i);
              if (!el) return;
              const src = docLocal("polaroid" + i, "");
              el.innerHTML = "";
              const anh = document.createElement("div");
              anh.className = "pol-anh";
              if (src) anh.style.backgroundImage = 'url("' + src + '")'; else anh.textContent = "+ thêm ảnh";
              el.appendChild(anh);
              if (src) {
                  const x = document.createElement("button");
                  x.className = "pol-xoa"; x.textContent = "✕"; x.title = "Xoá ảnh";
                  x.onclick = function(e) { e.stopPropagation(); try { localStorage.removeItem("polaroid" + i); } catch (er) {} dungPolaroid(i); };
                  el.appendChild(x);
              }
              el.onclick = function() {
                  const inp = document.getElementById("pol-file");
                  inp.onchange = function() { const f = inp.files[0]; inp.value = ""; if (f) nenAnh(f, i); };
                  inp.click();
              };
          }

          function nenAnh(f, i) {
              const url = URL.createObjectURL(f), img = new Image();
              img.onload = function() {
                  const k = Math.min(1, 360 / Math.max(img.width, img.height));
                  const c = document.createElement("canvas");
                  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
                  URL.revokeObjectURL(url);
                  try { localStorage.setItem("polaroid" + i, JSON.stringify(c.toDataURL("image/jpeg", 0.78))); }
                  catch (e) { hienModal("Không lưu được ảnh (bộ nhớ trình duyệt đã đầy).", "OK", null, true); return; }
                  dungPolaroid(i);
              };
              img.onerror = function() { URL.revokeObjectURL(url); hienModal("Không đọc được file ảnh này.", "OK", null, true); };
              img.src = url;
          }
          dungPolaroid(1);
          dungPolaroid(2);

          veHeader();
          _init();
          tuTaoTaskLap();

          // Vẽ lại mọi màn hình đang liên quan (dùng khi dữ liệu đổi từ thiết bị khác)
          function capNhatTatCaManHinh() {
              veGiaoDien();
              if (document.getElementById("lich-tab").classList.contains("active")) veLich();
              if (luuTruMoDang) veLuuTru();
          }

          function capNhatTieuDeLuuTru() {
              let el = document.getElementById("luu-tru-title");
              if (!el) return;
              let so = danhSachData.filter(t => t.luuTru).length;
              el.textContent = "📦 Lưu trữ" + (so > 0 ? " (" + so + ")" : "");
          }

          // ============================================
          // HÀM TIỆN ÍCH
          // ============================================
          function layNgayHomNay() {
              const now = new Date();
              const y = now.getFullYear();
              const m = String(now.getMonth() + 1).padStart(2, "0");
              const d = String(now.getDate()).padStart(2, "0");
              return y + "-" + m + "-" + d;
          }

          function dinhDangNgay(chuoiNgay) {
              let [nam, thang, ngay] = chuoiNgay.split("-");
              return ngay + "/" + thang;
          }

          function dinhDangGio(chuoiDatetime) {
              // Deadline có thể chỉ có ngày ("YYYY-MM-DD") → không có giờ
              if (!chuoiDatetime || chuoiDatetime.indexOf("T") === -1) return "";
              let gio = chuoiDatetime.split("T")[1];
              let [h, m] = gio.split(":");
              let c = h24To12(h);
              return c.h12 + ":" + m + " " + c.ampm;
          }

          function luuDuLieu() {
              try { localStorage.setItem("todos", JSON.stringify(danhSachData)); } catch (e) {}
              window.danhSachData = danhSachData;
              if (typeof window.syncToCloud === "function") window.syncToCloud("todos");
          }

          function nhimEnter(event) {
              if (event.key === "Enter" && !event.isComposing) themCongViec();   // isComposing: đang gõ Telex/VNI
          }

          function toDateKeyFromDeadline(deadline) {
              if (!deadline) return null;
              return String(deadline).split("T")[0] || null;
          }

          function toTomorrowKey(dateKey) {
              const base = dateKey || layNgayHomNay();
              const [y, m, d] = base.split("-").map(Number);
              const next = new Date(y, m - 1, d + 1);
              const yy = next.getFullYear();
              const mm = String(next.getMonth() + 1).padStart(2, "0");
              const dd = String(next.getDate()).padStart(2, "0");
              return yy + "-" + mm + "-" + dd;
          }

          function copyHomNaySangNgayMai() {
              const today = layNgayHomNay();
              const tomorrow = toTomorrowKey(today);

              const todays = danhSachData.filter(t => !t.luuTru && toDateKeyFromDeadline(t.deadline) === today);
              if (!todays.length) {
                  hienModal("Không có task nào của hôm nay để copy.", "OK", null, true);
                  return;
              }

              // Task đã có sẵn ở ngày mai (cùng tên + cùng danh sách) thì bỏ qua → bấm nhiều lần không bị nhân đôi
              const khoaTask = t => t.tenCongViec + "|" + (t.danhSach || "");
              const daCo = new Set(
                  danhSachData.filter(t => !t.luuTru && toDateKeyFromDeadline(t.deadline) === tomorrow).map(khoaTask)
              );

              let added = 0, skipped = 0;
              todays.forEach(t => {
                  const khoa = khoaTask(t);
                  if (daCo.has(khoa)) { skipped++; return; }
                  daCo.add(khoa);

                  const time = String(t.deadline).split("T")[1];   // undefined nếu task chỉ có ngày
                  const id = taoId();
                  idMoi.add(id);
                  danhSachData.push({
                      id:          id,
                      tenCongViec: t.tenCongViec,
                      hoànThành:   false,
                      deadline:    time ? tomorrow + "T" + time : tomorrow,
                      con:         copyCon(t),
                      danhSach:    t.danhSach || null
                  });
                  added++;
              });

              if (added) {
                  luuDuLieu();
                  veGiaoDien();
              }
              let msg = "Đã copy " + added + " task từ hôm nay sang ngày mai.";
              if (skipped) msg += "\n" + skipped + " task đã có sẵn ở ngày mai nên được bỏ qua.";
              hienModal(msg, "OK", null, true);
          }

          function themCongViec() {
              let input         = document.getElementById("input-cong-viec");
              let inputDanhSach = document.getElementById("input-danh-sach");
              let congViec      = input.value.trim();

              if (congViec === "") {
                  alert("Bạn chưa nhập công việc!");
                  return;
              }

              let id = taoId();
              idMoi.add(id);
              danhSachData.push({
                  id:          id,
                  tenCongViec: congViec,
                  hoànThành:   false,
                  deadline:    layDeadlineTuForm() || (document.getElementById("input-lap").value ? layNgayHomNay() : null),
                  danhSach:    inputDanhSach.value || null,
                  lap:         document.getElementById("input-lap").value || null
              });

              luuDuLieu();
              veGiaoDien();

              input.value = "";
              datVaoForm(null);
              inputDanhSach.value = "";
              document.getElementById("input-lap").value = "";
              input.focus();
          }

      </script>

  </body>
  </html>
